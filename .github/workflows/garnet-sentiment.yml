name: Garnet sentiment dependency visibility

on:
    pull_request:
        paths:
            - pyproject.toml
            - uv.lock
            - .github/workflows/garnet-sentiment.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    sentiment-dependencies:
        name: Sentiment dependency group install (recorded)
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@96e9f81ec0f59f2322e8c67b43c4d4017d932ad3 # v2.4.1
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}
                  jibril_version: v2.16.0

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'

            - name: Install sentiment dependencies
              run: uv sync --frozen --only-group sentiment
