name: Kolbo integration build

on:
  push:
    branches: [master]
    paths:
      - "integrations/kolbo-mcp/**"
      - ".github/workflows/kolbo-mcp-build.yml"
  pull_request:
    paths:
      - "integrations/kolbo-mcp/**"
      - ".github/workflows/kolbo-mcp-build.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: kolbo-mcp-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install and build
        working-directory: integrations/kolbo-mcp
        run: |
          npm install
          npm run build
