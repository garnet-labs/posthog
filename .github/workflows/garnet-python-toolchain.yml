name: Garnet Python toolchain visibility

on:
    pull_request:
        paths:
            - .github/workflows/garnet-python-toolchain.yml
            - .github/workflows/build-hogql-parser-rs.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    python-toolchain:
        name: Python toolchain install (recorded)
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}
                  jibril_version: v2.16.0

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'

            - name: Check uv
              run: uv --version
