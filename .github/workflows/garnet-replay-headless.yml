name: Garnet replay headless visibility

on:
    pull_request:
        paths:
            - common/replay-headless/**
            - .github/workflows/garnet-replay-headless.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    replay-headless-install:
        name: Replay headless install (recorded)
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@96e9f81ec0f59f2322e8c67b43c4d4017d932ad3 # v2.4.1
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}
                  jibril_version: v2.16.0

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc

            - name: Install replay-headless dependencies
              run: pnpm --filter=@posthog/replay-headless... install --frozen-lockfile
