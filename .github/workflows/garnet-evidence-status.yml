name: Garnet Evidence Status

# Mirrors the Garnet Runtime Review verdict for the PR head as a
# `garnet/runtime-evidence` commit status, so the fail-closed evidence gate
# is visible in the PR checks UI (and usable in branch protection) instead
# of only inside the stamphog sticky comment.
#
# Scope mirrors the approval agent: only PRs carrying the `stamphog` label,
# and only same-repo heads (the fork token cannot write statuses). The
# issue_comment arm fires when the Garnet bot's sticky comment lands or
# updates (the record usually arrives after the first review pass).
on:
    pull_request:
        types: [labeled, ready_for_review, synchronize]
    issue_comment:
        types: [created, edited]

permissions:
    contents: read
    statuses: write
    pull-requests: write

concurrency:
    group: garnet-evidence-status-${{ github.event.pull_request.number || github.event.issue.number }}
    cancel-in-progress: true

jobs:
    status:
        if: >-
            (
              github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository
              && (
                github.event.label.name == 'stamphog'
                || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stamphog'))
              )
            )
            || (
              github.event_name == 'issue_comment'
              && github.event.issue.pull_request
              && github.event.comment.user.login == 'garnet-runtime-review[bot]'
              && contains(github.event.comment.body, 'garnet-runtime-review')
              && contains(github.event.issue.labels.*.name, 'stamphog')
            )
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            # Trusted source only: script from the base branch (PR events) or
            # the default branch (comment events), never from the PR head.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
                  sparse-checkout: |
                      tools/pr-approval-agent
                      .stamphog

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'
                  enable-cache: false

            - name: Post evidence status
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Unrebased bases predating this tool: skip gracefully.
                  if [ ! -f tools/pr-approval-agent/evidence_status.py ]; then
                    echo "evidence_status.py absent on trusted ref; skipping"
                    exit 0
                  fi
                  uv run tools/pr-approval-agent/evidence_status.py \
                    ${{ github.event.pull_request.number || github.event.issue.number }} \
                    --repo ${{ github.repository }}

            # Same parse, rendered into the PR description between
            # garnet:evidence markers, so AI reviewers that read the body
            # (Greptile) ground in head-pinned recorded evidence.
            - name: Sync evidence into PR body
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ ! -f tools/pr-approval-agent/evidence_body.py ]; then
                    echo "evidence_body.py absent on trusted ref; skipping"
                    exit 0
                  fi
                  uv run tools/pr-approval-agent/evidence_body.py \
                    ${{ github.event.pull_request.number || github.event.issue.number }} \
                    --repo ${{ github.repository }}
