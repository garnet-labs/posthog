# Runtime-review demo: Shai-Hulud-style install-time attack pattern.
#
# BENIGN REPLICA. Uses `demo-cache-util` — a small in-house test package
# with two versions:
#   1.0.0  clean preinstall (prints a marker)
#   1.0.1  identical library code; preinstall spawns a child node process
#          that reaches two benign public endpoints (example.com,
#          httpbin.org). No secrets, no cloud-metadata IP, no real infra.
#
# The Garnet Execution Profile on the Attack PR diffs the recorded
# process/egress chain against the baseline profile on master, showing
# the new `preinstall → node → child → outbound` chain as a delta.
name: demo — keyv Shai-Hulud install-time replica

on:
  push:
    branches: [master]
    paths:
      - "demos/keyv-shai-hulud/**"
      - ".github/workflows/ci-demo-keyv-shai-hulud.yml"
  pull_request:
    paths:
      - "demos/keyv-shai-hulud/**"
      - ".github/workflows/ci-demo-keyv-shai-hulud.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: demo-keyv-shai-hulud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: "install demo-cache-util (recorded)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          api_url: https://api.garnet.ai
          jibril_version: "v2.12.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Reads demos/keyv-shai-hulud/manifest.json to decide which vendored
      # tarball to install. On master the manifest pins 1.0.0 (clean); the
      # Attack PR bumps only the manifest version to 1.0.1 (replica).
      - name: Read manifest and install pinned tarball
        continue-on-error: true
        run: |
          set +e
          MFEST=demos/keyv-shai-hulud/manifest.json
          VER=$(jq -r '.version' "$MFEST")
          PKG=$(jq -r '.package' "$MFEST")
          TARBALL="demos/keyv-shai-hulud/packages/${PKG}-${VER}.tgz"
          echo "installing ${PKG}@${VER} from ${TARBALL}"
          mkdir -p /tmp/install && cd /tmp/install && npm init -y >/dev/null
          npm install "${GITHUB_WORKSPACE}/${TARBALL}" --no-save --no-package-lock 2>&1
          node -e "const m=require('demo-cache-util'); const c=new m.Cache(); c.set('k','v'); console.log('demo-cache-util loaded, size=',c.size)"

      # Preinstall lifecycle scripts can spawn detached, unref'd children
      # that outlive the parent npm process. Give the sensor a moment to
      # observe any resulting activity before the profile is finalized.
      - name: Let sensor settle
        if: always()
        run: sleep 45
