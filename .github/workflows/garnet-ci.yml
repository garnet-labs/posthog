name: Garnet Runtime Visibility

# Runs the riskiest representative CI surface — dependency install, where
# lifecycle scripts execute — under the Garnet eBPF sensor. Garnet posts a
# sticky "Garnet Runtime Review" comment on the PR (every recorded outbound
# connection with its process lineage, bound to the head commit), which the
# stamphog PR approval agent consumes as deterministic runtime evidence
# (see tools/pr-approval-agent/runtime_evidence.py).
on:
    pull_request:
        paths:
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - .nvmrc
            - .github/workflows/garnet-ci.yml
    workflow_dispatch:
        inputs:
            checkout_ref:
                description: Exact PR head SHA to cold-read
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: garnet-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    dep-install:
        name: Dependency install (recorded)
        # Fork `pull_request` runs get no org secrets, so the sensor has no token
        # to authenticate with. Skip the whole job there: an unrecorded install
        # is not a cheaper version of this job, it is the absence of it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}
                  jibril_version: v2.16.0

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc

            # Deliberately not routed through ./.github/actions/pnpm-install.
            # That composite restores the pnpm store, and a warm store means the
            # lifecycle scripts this workflow exists to observe never execute.
            # The cold install is the measurement, not an oversight.
            #
            # `--no-frozen-lockfile` is load-bearing too: pnpm defaults to frozen
            # under CI=true and aborts on lockfile drift before fetching anything,
            # which records nothing for exactly the dependency-changing PRs this
            # job exists to observe.
            - name: Install dependencies (lifecycle scripts execute here)
              run: pnpm install --no-frozen-lockfile

    backend-deps:
        name: Backend dependency install (recorded)
        # Fork `pull_request` runs get no org secrets, so the sensor has no token
        # to authenticate with. Skip the whole job there: an unrecorded run is
        # not a cheaper version of this job, it is the absence of it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.13.13

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit

            - name: Install SAML dependencies
              run: sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install Rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.91.1
              with:
                  toolchain: 1.91.1
                  components: cargo

            - name: Install Python dependencies (build backends execute here)
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
