name: Garnet Runtime Visibility

# Runs the riskiest representative CI surface — dependency install, where
# lifecycle scripts execute — under the Garnet eBPF sensor. Garnet posts a
# sticky "Garnet Runtime Review" comment on the PR (every recorded outbound
# connection with its process lineage, bound to the head commit), which the
# stamphog PR approval agent consumes as deterministic runtime evidence
# (see tools/pr-approval-agent/runtime_evidence.py).
on:
    pull_request:
    push:
        branches:
            - devin/probe-uv-source-build
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: garnet-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    dep-install:
        name: Dependency install (recorded)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@v2
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies (lifecycle scripts execute here)
              run: pnpm install --no-frozen-lockfile

    backend-deps:
        name: Backend dependency install (recorded)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@v2
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.13.13

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit

            - name: Install SAML dependencies
              run: sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install Rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.91.1
              with:
                  toolchain: 1.91.1
                  components: cargo

            - name: Install Python dependencies (build backends execute here)
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
