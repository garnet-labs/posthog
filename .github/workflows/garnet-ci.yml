name: Garnet Runtime Visibility

# Runs the riskiest representative CI surface — dependency install, where
# lifecycle scripts execute — under the Garnet eBPF sensor. Garnet posts a
# sticky "Garnet Runtime Review" comment on the PR (every recorded outbound
# connection with its process lineage, bound to the head commit), which the
# stamphog PR approval agent consumes as deterministic runtime evidence
# (see tools/pr-approval-agent/runtime_evidence.py).
on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: garnet-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    dep-install:
        name: Dependency install (recorded)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies (lifecycle scripts execute here)
              run: pnpm install --no-frozen-lockfile

    python-toolchain:
        name: Python toolchain install (recorded)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Garnet Runtime Visibility
              uses: garnet-org/action@v2
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'

            - name: Check uv
              run: uv --version
