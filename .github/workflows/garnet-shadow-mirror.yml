name: Shadow dependency mirror
on:
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:
        inputs:
            prs:
                description: Optional space-separated change numbers
                required: false
                type: string
            dry_run:
                description: List eligible changes without writing to GitHub
                type: boolean
                default: false
permissions: {}
concurrency:
    group: shadow-dependency-mirror
    cancel-in-progress: false
jobs:
    sync:
        if: github.repository == 'garnet-labs/posthog'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            SHADOW_MIRROR_TOKEN: ${{ secrets.SHADOW_MIRROR_TOKEN }}
            PRS: ${{ inputs.prs }}
            DRY_RUN: ${{ inputs.dry_run }}
        steps:
            - name: Check authentication
              run: |
                  if [ "$DRY_RUN" != true ] && [ -z "$SHADOW_MIRROR_TOKEN" ]; then
                    echo '::error::Set SHADOW_MIRROR_TOKEN to a PAT with write access to Contents, Pull requests, Actions, and Workflows.'
                    exit 1
                  fi
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  sparse-checkout: .github/scripts/shadow_mirror
                  sparse-checkout-cone-mode: false
                  persist-credentials: false
            - name: Sync dependency changes
              env:
                  GH_TOKEN: ${{ inputs.dry_run && github.token || '' }}
              shell: bash
              run: |
                  set -euo pipefail
                  args=()
                  if [[ "$DRY_RUN" == true ]]; then
                    args+=(--dry-run)
                  fi
                  for pr in $PRS; do
                    [[ "$pr" =~ ^[0-9]+$ ]] || { echo 'Invalid change number'; exit 1; }
                    args+=(--pr "$pr")
                  done
                  python3 .github/scripts/shadow_mirror/mirror.py sync "${args[@]}"
