name: Kolbo integration test

on:
  push:
    branches: [master]
    paths:
      - "integrations/kolbo-mcp/**"
      - ".github/workflows/kolbo-mcp-test.yml"
  pull_request:
    paths:
      - "integrations/kolbo-mcp/**"
      - ".github/workflows/kolbo-mcp-test.yml"
  workflow_dispatch: {}

permissions: {}

env:
  KOLBO_MCP_VERSION: "1.57.0"

concurrency:
  group: kolbo-mcp-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pinned @kolbo/mcp
        working-directory: integrations/kolbo-mcp
        run: npm install --save-exact "@kolbo/mcp@${KOLBO_MCP_VERSION}"

      - name: Smoke test (boot MCP server)
        working-directory: integrations/kolbo-mcp
        run: npm test
