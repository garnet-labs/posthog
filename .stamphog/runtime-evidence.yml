# Garnet runtime-evidence policy (vendored local extension — see
# tools/pr-approval-agent/README.md). Trusted data: lives in .stamphog/ so
# every edit is human-reviewed via the stamphog_policy deny category.
version: 1
# Only comments authored by these logins are read as runtime evidence.
trusted_bots:
    - 'garnet-runtime-review[bot]'
# Grounding is the execution tree itself: each destination is judged by the
# process lineage chain that produced it, in the context of the diff, by the
# LLM reviewer. There is no static egress allowlist. Deterministic signals
# are integrity (trusted author, head-pinned, parseable, non-empty) and the
# renderer's comparison against the previously profiled commit (new chains
# block the bypass).
# Deny categories that usable runtime evidence may clear (to LLM review,
# never auto-approve). Mirrors the Migration risk check bypass.
bypass_categories:
    - deps_toolchain
